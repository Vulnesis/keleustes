[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
kls-proto = { path = "crates/kls-proto" }
kls-store = { path = "crates/kls-store" }
kls-core = { path = "crates/kls-core" }
kls-node = { path = "crates/kls-node" }
kls-ui = { path = "crates/kls-ui" }
kls-vault = { path = "crates/kls-vault" }
kls-github = { path = "crates/kls-github" }
kls-engine = { path = "crates/kls-engine" }
kls-libsearch = { path = "crates/kls-libsearch" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4", "v7"] }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
if-addrs = "0.15"
tempfile = "3"
time = "0.3"
pem = "3"
jiff = "0.2"
async-trait = "0.1"
croner = { version = "4", default-features = false, features = ["jiff"] }
egui_plot = "0.38"
similar = "2"
vt100 = "0.16"
chacha20poly1305 = "0.10"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
serde_norway = "0.9"
notify-rust = "4"
tray-icon = "0.26"
# Brand mark rasteriser (the Phosphor FLOW_ARROW glyph) and icon files.
ab_glyph = "0.2"
png = "0.18"
gtk = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ed25519-dalek = "2"
# Library search (kls-libsearch).
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
globset = "0.4"
bytes = "1"
